name: build

on:
  workflow_dispatch:

env:
  CHASM_REV: f608f85e407ff1b7689d54a9aafdd16e95711ac4
  SK8_REV: cb7968930f14dad38457e98720d1a274e469eec2

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get chasm's mashup (skate engine crates)
        shell: bash
        run: |
          git init -q chasm && cd chasm
          git fetch -q --depth 1 https://github.com/chasmlol/2010-rust-rewrite-mashup.git $CHASM_REV
          git checkout -q FETCH_HEAD

      - name: Patch engine (skip unfinished features instead of crashing)
        shell: bash
        run: python patches/apply.py

      - name: Get SK8-ENGINE (converter tools)
        shell: bash
        run: |
          git init -q sk8 && cd sk8
          git fetch -q --depth 1 https://github.com/SK8-ENGINE/skate-3-rust-engine.git $SK8_REV
          git checkout -q FETCH_HEAD

      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sk3jka

      - name: Build skate engine DLL
        shell: bash
        run: |
          cd sk3jka
          cargo build --release 2>&1 | tee ../cargo.log
          test ${PIPESTATUS[0]} -eq 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build Skate 3 converter
        shell: pwsh
        run: |
          python -m pip install -r sk8/tools/requirements-setup.txt
          ./chasm/skate/converter/build.ps1 -SkateEngine sk8 -Out dist

      - name: Package
        shell: bash
        run: |
          mkdir -p out/skate3
          cp sk3jka/target/release/sk3jka.dll out/skate3/
          cp dist/iw4l-skate-convert.exe out/skate3/skate3-convert.exe

      - uses: actions/upload-artifact@v4
        with:
          name: skate3-engine
          path: out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs
          path: cargo.log
          if-no-files-found: ignore
